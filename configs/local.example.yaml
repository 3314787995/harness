# Copy this file to configs/local.yaml (ignored by Git) and adjust only local paths.
model:
  path: ${QWEN3VL_MODEL_PATH:-Qwen/Qwen3-VL-2B-Instruct}
  device: auto
  dtype: bfloat16
  attn_implementation: sdpa
  generation:
    max_new_tokens: 64
    temperature: 0.0
  video:
    min_pixels: 4096
    max_pixels: 262144
    total_pixels: 4194304
    fps: 1.0
    max_frames: 32

coarse_to_fine:
  cache_dir: ${QWEN3VL_CACHE_DIR:-.cache/qwen3vl_agent}

active_tree:
  cache_dir: ${QWEN3VL_CACHE_DIR:-.cache/qwen3vl_agent}
