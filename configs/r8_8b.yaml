  repair_rounds: 3
  max_joint_candidates: 8
  max_query_nodes: 64
  max_query_depth: 16
  max_numeric_digits: 100
  max_geometry_rules: 50
  solver_seconds: 5.0
  max_model_calls: 128
  max_unique_frames: 4096
  max_seconds: 900.0
  compiler_tokens: 768
  observer_tokens: 1024
  formalizer_tokens: 2048
  auditor_tokens: 1024
  model_revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
  media:
    cache_dir: ${QWEN3VL_CACHE_DIR:-.cache/qwen3vl_agent}/r8
