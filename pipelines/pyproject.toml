[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3vl-agent"
version = "0.1.0"
description = "Nine current training-free Qwen3-VL video reasoning pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=1.26",
  "Pillow>=10",
  "accelerate>=1.0",
  "av>=14",
  "PyYAML>=6.0",
  "qwen-vl-utils>=0.0.14",
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.57.0,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
eval = ["pyarrow>=17,<22"]
r8 = ["z3-solver==5.1.0.0"]

[project.scripts]
qwen3vl-agent = "qwen3vl_agent.cli:main"
qwen3vl-r7 = "qwen3vl_agent.r7.evaluate:main"
qwen3vl-r6 = "qwen3vl_agent.r6.evaluate:main"
qwen3vl-r8 = "qwen3vl_agent.r8.evaluate:main"
qwen3vl-r9 = "qwen3vl_agent.r9.evaluate:main"

[tool.setuptools.packages.find]
include = ["qwen3vl_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E9", "F", "I", "B023"]
