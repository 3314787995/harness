name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  control-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install \
            "pytest>=8" \
            "ruff>=0.9" \
            "PyYAML>=6" \
            "Pillow>=10" \
            "jsonschema>=4.23,<5" \
            "pyarrow>=17,<22"
      - name: Lint
        run: python -m ruff check qwen3vl_agent tests scripts tools examples
      - name: Compile
        run: python -m compileall -q qwen3vl_agent
      - name: Unit tests
        run: python -m pytest -q
