name: Nine-pipeline CPU verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install -e . --no-deps
          python -m pip install -r requirements-cpu.txt
      - name: Release integrity and no-model API/config preflight
        run: python tools/check_release.py
      - name: Compile
        if: ${{ !cancelled() }}
        run: python -m compileall -q qwen3vl_agent
      - name: Lint
        if: ${{ !cancelled() }}
        run: python -m ruff check qwen3vl_agent tests scripts tools
      - name: Current regressions (known failures remain visible)
        if: ${{ !cancelled() }}
        run: python -m pytest -q --tb=short
